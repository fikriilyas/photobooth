services:
  app:
    build: .
    container_name: photobooth-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/app/prisma
      - uploads-data:/app/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: photobooth-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - app
    networks:
      - internal

  certbot:
    image: certbot/certbot
    container_name: photobooth-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    networks:
      - internal

volumes:
  db-data:
  uploads-data:
  certbot-conf:
  certbot-www:

networks:
  internal:
    driver: bridge
